name: Bug report
description: Something doesn't work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The more detail you give, the faster this gets
        fixed. If you can, attach a support bundle — run
        `TCGCardShopSimModManager.Cli support-bundle` and share the zip. It
        collects logs and environment info **without** your Nexus key.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I clicked Install with X manifest, the app closed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered steps that get us to the bug.
      placeholder: |
        1. Run `...`
        2. Open the app
        3. Click `...`
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version shown in the window title or `TCGCardShopSimModManager.Cli --version`.
    validations:
      required: true
  - type: dropdown
    id: frontend
    attributes:
      label: Which front-end?
      options:
        - Desktop app
        - CLI
        - Both
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, where the game is installed, anything unusual.
      placeholder: Windows 11 24H2, game on D:\SteamLibrary, .NET runtime present.
